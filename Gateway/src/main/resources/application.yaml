server:
    port: ${SERVER_PORT:8088}

spring:
    application:
        name: Gateway
    cloud:
        gateway:
            routes:
                - id: auth-service
                  uri: ${GATEWAY_AUTH_SERVICE_URI:http://localhost:8084}
                  predicates:
                      - Path=/api/v1/auth/**
                - id: user-service
                  uri: ${GATEWAY_USER_SERVICE_URI:http://localhost:8082}
                  predicates:
                      - Path=/api/v1/users/**
                - id: order-service
                  uri: ${GATEWAY_ORDER_SERVICE_URI:http://localhost:8081}
                  predicates:
                      - Path=/api/v1/orders/**
                - id: store-service
                  uri: ${GATEWAY_STORE_SERVICE_URI:http://localhost:8085}
                  predicates:
                      - Path=/api/v1/stores/**,/api/v1/owner/stores/**
                - id: payment-service
                  uri: ${GATEWAY_PAYMENT_SERVICE_URI:http://localhost:8086}
                  predicates:
                      - Path=/api/v1/payments/**
                - id: point-service
                  uri: ${GATEWAY_POINT_SERVICE_URI:http://localhost:8087}
                  predicates:
                      - Path=/api/v1/points/**

gateway:
    auth:
        jwt:
            secret: ${AUTH_JWT_SECRET:auth-super-secret-auth-super-secret-2026}
    rate-limit:
        enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
        trust-forwarded-for: ${GATEWAY_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
        cleanup-threshold: ${GATEWAY_RATE_LIMIT_CLEANUP_THRESHOLD:100000}
        auth:
            enabled: ${GATEWAY_RATE_LIMIT_AUTH_ENABLED:true}
            path-patterns:
                - /api/v1/auth/**
            request-limit: ${GATEWAY_RATE_LIMIT_AUTH_REQUEST_LIMIT:60}
            rate-limit-period-seconds: ${GATEWAY_RATE_LIMIT_AUTH_PERIOD_SECONDS:60}
        public-api:
            enabled: ${GATEWAY_RATE_LIMIT_PUBLIC_API_ENABLED:true}
            path-patterns:
                - /api/v1/stores/**
            request-limit: ${GATEWAY_RATE_LIMIT_PUBLIC_API_REQUEST_LIMIT:300}
            rate-limit-period-seconds: ${GATEWAY_RATE_LIMIT_PUBLIC_API_PERIOD_SECONDS:60}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    metrics:
        distribution:
            percentiles-histogram:
                http.server.requests: true
        tags:
            application: ${spring.application.name}
